openapi: 3.0.4
info:
  title: PDF to Text
  description: >-
    PDF to Text extracts the text layer of a PDF, uploaded or fetched from a
    URL, and returns it as plain text with the page, word and character counts.
    Paid plans add the text of each page separately and the document metadata,
    such as title, author and creation date.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/pdftotext:
    post:
      summary: PDF to Text
      description: Extract the text from an uploaded PDF or a PDF URL
      operationId: pdftotext
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  text: >-
                    Table Of Content

                    Chapter 1
                    .......................................................... 2

                    Paragraph 1.1
                    ...................................................... 3

                    page 1 / 3


                    Chapter 1

                    page 2 / 3


                    Paragraph 1.1

                    Powered by TCPDF (www.tcpdf.org)

                    page 3 / 3
                  pageCount: 3
                  pagesExtracted: 3
                  truncated: false
                  hasText: true
                  wordCount: 31
                  characterCount: 250
                  pages:
                    - page: 1
                      text: >-
                        Table Of Content

                        Chapter 1
                        ..........................................................
                        2

                        Paragraph 1.1
                        ...................................................... 3

                        page 1 / 3
                      wordCount: 15
                    - page: 2
                      text: |-
                        Chapter 1
                        page 2 / 3
                      wordCount: 6
                    - page: 3
                      text: |-
                        Paragraph 1.1
                        Powered by TCPDF (www.tcpdf.org)
                        page 3 / 3
                      wordCount: 10
                  metadata:
                    title: Basic API Test
                    author: Brendan Dahl
                    subject: null
                    creator: pdf.js
                    producer: TCPDF 5.9.133 (http://www.tcpdf.org)
                    creationDate: '2012-04-10T21:30:26.000Z'
                    modificationDate: '2012-04-10T21:30:26.000Z'
                    pdfVersion: '1.7'
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                pdf:
                  type: string
                  format: binary
                  description: 'File to upload (accepted: .pdf, max 10MB)'
                  x-acceptedTypes:
                    - .pdf
                  x-maxSizeMB: 10
              required:
                - pdf
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  pdf: https://raw.githubusercontent.com/mozilla/pdf.js/master/test/pdfs/basicapi.pdf
